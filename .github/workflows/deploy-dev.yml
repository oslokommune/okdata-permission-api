name: Deploy Dev

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    - name: Setup local keycloak
      run: make setup-keycloak-local
    - name: Set up Python 3.11
      uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
      with:
        python-version: '3.11'
    - name: Install Python dependencies
      run: pip install tox
    - name: Test with tox
      run: tox -e py,flake8,black
    - name: Tear down local keycloak
      run: make tear-down-keycloak-local
    - name: Set up AWS SAM CLI
      uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
      with:
        use-installer: true
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Validate SAM template
      run: sam validate --lint --region eu-west-1
    - name: Build Docker image
      run: sam build
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_DEV }}:role/github-deploy
        aws-region: eu-west-1
    - name: Sts GetCallerIdentity
      run: aws sts get-caller-identity
    - name: Deploy Lambda functions
      run: sam deploy --config-env dev --image-repository ${{ secrets.AWS_ACCOUNT_DEV }}.dkr.ecr.eu-west-1.amazonaws.com/serverless-okdata-permission-api-dev --parameter-overrides "Stage=dev GitRev=${GITHUB_REF_NAME}:${GITHUB_SHA::7}"
